<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      // GitHub Pages SPA fallback — redirect 404s to index.html preserving the path
      var base = '/airbrush-color-mixer';
      var path = location.pathname.slice(base.length) || '/';
      var search = location.search;
      var hash = location.hash;
      location.replace(base + '/?redirect=' + encodeURIComponent(path + search + hash));
    </script>
  </head>
  <body></body>
</html>
